<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GPAC Agenda - Login</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
</head>
<body>
  <main class="container">
    <div class="card">
      <div class="logo-wrap">
        <img src="logo.png" alt="GPAC Agenda" class="logo" />
      </div>
      <h1 class="card-title">Entrar</h1>
      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="username">E-mail</label>
          <input type="email" id="username" name="username" placeholder="seu@exemplo.com" required autocomplete="email" />
        </div>
        <div class="form-group">
          <label for="password">Senha</label>
          <input type="password" id="password" name="password" placeholder="Senha" required autocomplete="current-password" />
        </div>
        <div class="form-actions">
          <button type="submit" class="btn-primary">Entrar</button>
        </div>
      </form>
      <div class="card-footer">
        <p>Não tem conta? <a href="register.html">Cadastre-se</a></p>
      </div>
    </div>
  </main>
  <script type="module" src="scripts.js"></script>
</body>
</html>
